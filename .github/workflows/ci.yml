name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: macOS / Node 24
    # The updater tests exercise macOS disk images, signing and app replacement.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and service tests
        run: npm test
      - name: Agent backend integration tests
        run: npm run test:agents
      - name: ACP provider contract tests
        run: npm run test:acp
      - name: Build
        # The renderer bundle (Monaco and its language workers) needs more than
        # the ~2 GB heap Node picks by default on the 7 GB runner.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build
