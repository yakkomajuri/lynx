name: Feature request
description: Describe a use case or an improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow and where it falls short today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior you would like, with an example if helpful.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include any current workaround.
